# Enable mouse click focusing
set -g mouse on

# Create new panes in the same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

bind-key C-c display-popup -E "fish -c fp"
bind-key -r "T" run-shell "fish -c 'change_background &'"

# Non-leader mappings
bind-key -n C-z resize-pane -Z

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour35,bold'

# Status bar — hidden
set -g status off
# set -g status on
# set -g status-position bottom
# set -g status-style 'bg=default fg=colour248'
# set -g status-left '#[bold] #S #[default] '
# set -g status-right '%H:%M '
# set -g status-left-length 30
# set -g window-status-format ' #I:#W '
# set -g window-status-current-format '#[bold,fg=white] #I:#W '
set -g message-style 'bg=default fg=colour248'

# Set default shell
run-shell 'fish_path=$(command -v fish) && tmux set-option -g default-shell "$fish_path" || true'

# RGB/true colours:
set-option -a terminal-features 'tmux-256color:RGB'

# Vi navigation for copy-mode (`Ctrl-b [`):
set-window-option -g mode-keys vi

# Minimally required for Claude Code `osascript` hook for notifications
set -g allow-passthrough on

# TPM uses ~/.config/tmux/plugins/ when ~/.config/tmux/tmux.conf exists.
# Setup: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Reload this config, then press Ctrl-b I to install the plugins listed above.
# Docs: https://github.com/tmux-plugins/tpm#installation
# Keep TPM initialization last.
if-shell 'test -x ~/.config/tmux/plugins/tpm/tpm' 'run ~/.config/tmux/plugins/tpm/tpm'
